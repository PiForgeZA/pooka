# GoReleaser v2. Runs on tags matching v*. See .github/workflows/release.yml.
# release-please creates the tag, the release and its notes from CHANGELOG.md
# (.github/workflows/release-please.yml). GoReleaser only builds the archives and
# attaches them to that release.
version: 2

project_name: pooka

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pooka
    main: ./cmd/pooka
    binary: pooka
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/PiForgeZA/pooka/internal/cli.Version={{ .Version }}
  - id: pookad
    main: ./cmd/pookad
    binary: pookad
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    # pooka builds for Linux and macOS, pookad for Linux only, so the Linux
    # archives hold two binaries and the macOS ones hold one. That is intended.
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SPEC.md
      - scripts/**

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  # release-please writes the notes. See the header comment.
  disable: true

release:
  github:
    owner: PiForgeZA
    name: pooka
  draft: false
  prerelease: auto
  # Keep the notes release-please wrote. Only the assets are added.
  mode: keep-existing
