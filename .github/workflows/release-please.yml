name: Release PR

# release-please reads the conventional-commit titles on main since the last tag,
# keeps one release PR open with the next version and CHANGELOG.md, and on merge
# creates the tag and the GitHub release. release.yml then runs GoReleaser on the
# tag and uploads the archives to that release.
#
# RELEASE_PLEASE_TOKEN is a fine-grained PAT with contents and pull-requests write
# on this repo. A tag pushed with the default GITHUB_TOKEN would not trigger
# release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
